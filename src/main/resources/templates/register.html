<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký | FIGUREVERSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card login-card shadow border-0 w-100">
        <div class="card-body p-4 p-md-5">

            <a th:href="@{/}" class="text-decoration-none small">
                ← Về trang chủ
            </a>

            <h1 class="h3 fw-bold mt-4">Tạo tài khoản</h1>
            <p class="text-secondary">Đăng ký để mua sắm tại FIGUREVERSE.</p>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <form th:action="@{/register}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input id="fullName" name="fullName"
                           th:value="${fullName}"
                           class="form-control" maxlength="150" required>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input id="username" name="username"
                           th:value="${username}"
                           class="form-control" maxlength="50" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" name="email" type="email"
                           th:value="${email}"
                           class="form-control" maxlength="255" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input id="password" name="password" type="password"
                           class="form-control" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        Xác nhận mật khẩu
                    </label>
                    <input id="confirmPassword" name="confirmPassword"
                           type="password" class="form-control"
                           minlength="8" required>
                </div>

                <button class="btn btn-neon btn-lg w-100" type="submit">
                    Đăng ký
                </button>
            </form>

            <p class="small text-secondary mt-4 mb-0">
                Đã có tài khoản?
                <a th:href="@{/login}">Đăng nhập</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
