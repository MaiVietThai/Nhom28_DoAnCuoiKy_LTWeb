<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | FIGUREVERSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card login-card shadow border-0 w-100">
        <div class="card-body p-4 p-md-5">

            <a th:href="@{/}" class="text-decoration-none small">← Về trang chủ</a>

            <h1 class="h3 fw-bold mt-4">Đăng nhập</h1>
            <p class="text-secondary">Đăng nhập để truy cập tài khoản của bạn.</p>

            <!-- Thông báo đăng ký thành công -->
            <div class="alert alert-success"
                 th:if="${param.registered}">
                Đăng ký tài khoản thành công! Vui lòng đăng nhập.
            </div>

            <!-- Thông báo đăng nhập thất bại -->
            <div class="alert alert-danger"
                 th:if="${param.error}">
                Tên đăng nhập (hoặc email) hoặc mật khẩu không đúng.
            </div>

            <!-- Thông báo đăng xuất -->
            <div class="alert alert-success"
                 th:if="${param.logout}">
                Bạn đã đăng xuất.
            </div>

            <form th:action="@{/login}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Tên đăng nhập hoặc Email
                    </label>
                    <input id="username"
                           name="username"
                           class="form-control form-control-lg"
                           autocomplete="username"
                           placeholder="Nhập tên đăng nhập hoặc email..."
                           required
                           autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Mật khẩu
                    </label>
                    <input id="password"
                           name="password"
                           type="password"
                           class="form-control form-control-lg"
                           autocomplete="current-password"
                           placeholder="Nhập mật khẩu..."
                           required>
                </div>

                <button class="btn btn-neon btn-lg w-100" type="submit">
                    Đăng nhập
                </button>
            </form>

            <!-- Liên kết đăng ký tài khoản -->
            <div class="text-center mt-4">
                <span class="text-secondary small">Chưa có tài khoản?</span>
                <a th:href="@{/register}" class="fw-semibold text-decoration-none">
                    Đăng ký ngay
                </a>
            </div>

            <div class="small text-secondary mt-4">
                Tài khoản quản trị thử nghiệm xem trong README.md.
            </div>

        </div>
    </div>
</div>
</body>
</html>
