<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yêu thích | FIGUREVERSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background:#090b16; color:#eee; }
        .wish-card { background:#121629; border:1px solid #292d49;
                     border-radius:12px; padding:18px; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
        .wish-img { width:100%; height:220px; object-fit:contain;
                    background:#20233c; border-radius:8px; }
        .neon { color:#45f5ed; }
    </style>
</head>
<body>
<div class="container py-5">
    <a th:href="@{/}" class="btn btn-outline-light mb-4">
        ← Quay lại trang chủ
    </a>

    <h1 class="mb-2">♡ Sản phẩm yêu thích</h1>
    <p class="text-secondary mb-4">
        Bạn đã lưu <strong th:text="${wishlistCount}">0</strong> sản phẩm.
    </p>

    <div th:if="${#lists.isEmpty(wishlistProducts)}"
         class="alert alert-info">
        Bạn chưa có sản phẩm yêu thích nào.
        <a th:href="@{/#products}">Khám phá bộ sưu tập</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(wishlistProducts)}">
        <div class="col-12 col-sm-6 col-lg-4"
             th:each="product : ${wishlistProducts}">
            <div class="wish-card">
                <div>
                    <img class="wish-img mb-3"
                         th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                         th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">

                    <div class="wish-img d-flex align-items-center justify-content-center mb-3"
                         th:style="${product.imageUrl != null and !product.imageUrl.isEmpty()} ? 'display:none' : ''">
                        ✦ FIGUREVERSE
                    </div>

                    <h5 th:text="${product.name}">Tên mô hình</h5>
                    <p class="text-secondary"
                       th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}">Danh mục</p>

                    <div class="neon fw-bold mb-3"
                         th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        599.000 ₫
                    </div>
                </div>

                <div class="d-flex gap-2 pt-2">
                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-info" type="submit">
                            Thêm vào giỏ
                        </button>
                    </form>

                    <form th:action="@{/wishlist/remove/{id}(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger" type="submit">
                            Bỏ yêu thích
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
