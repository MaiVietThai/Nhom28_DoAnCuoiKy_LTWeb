<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị | FIGUREVERSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark site-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">FIGUREVERSE / QUẢN TRỊ</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-light btn-sm">Đăng xuất</button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div class="alert alert-success">Bạn đã đăng nhập thành công với quyền ADMIN.</div>
    <h1 class="h2">Bảng điều khiển</h1>
    <p class="text-secondary">Đây là trang quản trị khởi đầu. Các phần quản lý chi nhánh, sản phẩm, tồn kho và đơn hàng sẽ được bổ sung ở các giai đoạn tiếp theo.</p>
    <a th:href="@{/}" class="btn btn-neon">Xem website bán hàng</a>
</main>
</body>
</html>
