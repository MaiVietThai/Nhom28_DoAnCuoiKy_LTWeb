
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị nội dung | FIGUREVERSE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #090b16;
            color: #f3f1ff;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 18px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .admin-title {
            color: #4ef5ec;
            font-weight: 800;
        }

        .admin-card {
            background: #111629;
            border: 1px solid #29314b;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 22px;
        }

        .admin-card h2 {
            color: #4ef5ec;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-label {
            color: #e8e8fa;
            font-weight: 600;
        }

        .form-control {
            background: #090e1e;
            color: #fff;
            border: 1px solid #343d59;
        }

        .form-control:focus {
            background: #090e1e;
            color: #fff;
            border-color: #4ef5ec;
            box-shadow: 0 0 0 .2rem rgba(78,245,236,.12);
        }

        .form-control::placeholder {
            color: #929ab4;
        }

        textarea.form-control {
            min-height: 100px;
        }

        .btn-save {
            background: #4ef5ec;
            color: #090b16;
            font-weight: 800;
            border: 0;
            padding: 12px 24px;
        }

        .btn-save:hover {
            background: #b1fffa;
            color: #090b16;
        }

        .btn-back {
            color: #4ef5ec;
            border: 1px solid #4ef5ec;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .btn-back:hover {
            background: #4ef5ec;
            color: #090b16;
        }
    </style>
</head>

<body>
<div class="admin-container">

    <div class="admin-header">
        <div>
            <h1 class="admin-title">FIGUREVERSE</h1>
            <p class="text-secondary mb-0">
                Quản lý nội dung trang chủ
            </p>
        </div>

        <a th:href="@{/}" class="btn-back">
            ← Xem trang chủ
        </a>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         role="status"
         th:text="${successMessage}">
        Đã lưu thành công!
    </div>

    <form th:action="@{/admin/products/homepage}"
          th:object="${homeContent}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <section class="admin-card">
            <h2>01. Thanh thông báo</h2>

            <label class="form-label" for="announcement">
                Nội dung thông báo
            </label>
            <input id="announcement"
                   class="form-control"
                   type="text"
                   th:field="*{announcement}"
                   maxlength="255"
                   required>
        </section>

        <section class="admin-card">
            <h2>02. Khu vực nổi bật (Hero)</h2>

            <div class="mb-3">
                <label class="form-label" for="heroEyebrow">
                    Dòng chữ nhỏ
                </label>
                <input id="heroEyebrow"
                       class="form-control"
                       type="text"
                       th:field="*{heroEyebrow}"
                       maxlength="255"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="heroTitle">
                    Tiêu đề chính
                </label>
                <input id="heroTitle"
                       class="form-control"
                       type="text"
                       th:field="*{heroTitle}"
                       maxlength="255"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="heroDescription">
                    Mô tả
                </label>
                <textarea id="heroDescription"
                          class="form-control"
                          th:field="*{heroDescription}"
                          maxlength="2000"
                          required></textarea>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="heroButtonText">
                        Chữ trên nút
                    </label>
                    <input id="heroButtonText"
                           class="form-control"
                           type="text"
                           th:field="*{heroButtonText}"
                           maxlength="100"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="heroButtonLink">
                        Đường dẫn nút
                    </label>
                    <input id="heroButtonLink"
                           class="form-control"
                           type="text"
                           th:field="*{heroButtonLink}"
                           maxlength="255"
                           placeholder="/#collections"
                           required>
                </div>
            </div>
        </section>

        <section class="admin-card">
            <h2>03. Bộ sưu tập</h2>

            <div class="mb-3">
                <label class="form-label" for="collectionEyebrow">
                    Dòng chữ nhỏ
                </label>
                <input id="collectionEyebrow"
                       class="form-control"
                       type="text"
                       th:field="*{collectionEyebrow}"
                       maxlength="255"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="collectionTitle">
                    Tiêu đề
                </label>
                <input id="collectionTitle"
                       class="form-control"
                       type="text"
                       th:field="*{collectionTitle}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label class="form-label" for="collectionDescription">
                    Mô tả
                </label>
                <textarea id="collectionDescription"
                          class="form-control"
                          th:field="*{collectionDescription}"
                          maxlength="2000"
                          required></textarea>
            </div>
        </section>

        <section class="admin-card">
            <h2>04. Khu vực sản phẩm</h2>

            <div class="mb-3">
                <label class="form-label" for="productEyebrow">
                    Dòng chữ nhỏ
                </label>
                <input id="productEyebrow"
                       class="form-control"
                       type="text"
                       th:field="*{productEyebrow}"
                       maxlength="255"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="productTitle">
                    Tiêu đề
                </label>
                <input id="productTitle"
                       class="form-control"
                       type="text"
                       th:field="*{productTitle}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label class="form-label" for="productDescription">
                    Mô tả
                </label>
                <textarea id="productDescription"
                          class="form-control"
                          th:field="*{productDescription}"
                          maxlength="2000"
                          required></textarea>
            </div>
        </section>

        <section class="admin-card">
            <h2>05. Phần giới thiệu</h2>

            <div class="mb-3">
                <label class="form-label" for="aboutEyebrow">
                    Dòng chữ nhỏ
                </label>
                <input id="aboutEyebrow"
                       class="form-control"
                       type="text"
                       th:field="*{aboutEyebrow}"
                       maxlength="255"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="aboutTitle">
                    Tiêu đề
                </label>
                <input id="aboutTitle"
                       class="form-control"
                       type="text"
                       th:field="*{aboutTitle}"
                       maxlength="255"
                       required>
            </div>

            <div>
                <label class="form-label" for="aboutDescription">
                    Mô tả
                </label>
                <textarea id="aboutDescription"
                          class="form-control"
                          th:field="*{aboutDescription}"
                          maxlength="2000"
                          required></textarea>
            </div>
        </section>

        <section class="admin-card">
            <h2>06. Chân trang</h2>

            <label class="form-label" for="footerTagline">
                Câu giới thiệu cuối trang
            </label>
            <input id="footerTagline"
                   class="form-control"
                   type="text"
                   th:field="*{footerTagline}"
                   maxlength="500"
                   required>
        </section>

        <div class="d-flex gap-3 flex-wrap mb-5">
            <button type="submit" class="btn btn-save">
                Lưu thay đổi
            </button>

            <a th:href="@{/}" class="btn btn-outline-light">
                Hủy
            </a>
        </div>
    </form>
</div>
</body>
</html>
