
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">
        Sản phẩm
    </title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 28px;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #202638;
        }
        .container { max-width: 760px; margin: auto; }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 3px 15px #2026380a;
        }
        h1 { margin-top: 0; }
        .muted { color: #667085; }
        .field { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }
        input, textarea, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font: inherit;
            background: white;
        }
        textarea { min-height: 110px; resize: vertical; }
        input[type="checkbox"] { width: auto; }
        .check { display: flex; align-items: center; gap: 9px; }
        .check label { margin: 0; }
        .button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .primary { background: #202638; color: white; }
        .secondary { background: #e8ecf3; color: #202638; }
        .actions { display: flex; gap: 10px; margin-top: 22px; }
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #fee4e2;
            color: #b42318;
        }
        .preview {
            display: block;
            max-width: 220px;
            max-height: 220px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h1 th:text="${product == null ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'}">
            Sản phẩm
        </h1>
        <p class="muted">Nhập thông tin sản phẩm bên dưới.</p>

        <div th:if="${errorMessage}" class="alert"
             th:text="${errorMessage}"></div>

        <form method="post"
              th:action="@{/admin/products/save}"
              enctype="multipart/form-data">

            <input type="hidden" name="id"
                   th:if="${product != null}"
                   th:value="${product.id}">

            <div class="field">
                <label for="sku">Mã SKU *</label>
                <input id="sku" name="sku" required maxlength="50"
                       th:value="${product != null ? product.sku : ''}">
            </div>

            <div class="field">
                <label for="name">Tên sản phẩm *</label>
                <input id="name" name="name" required maxlength="200"
                       th:value="${product != null ? product.name : ''}">
            </div>

            <div class="field">
                <label for="description">Mô tả</label>
                <textarea id="description" name="description"
                          th:text="${product != null ? product.description : ''}"></textarea>
            </div>

            <div class="field">
                <label for="price">Giá (VNĐ) *</label>
                <input id="price" name="price" type="number"
                       min="0.01" step="0.01" required
                       th:value="${product != null ? product.price : ''}">
            </div>

            <div class="field">
                <label for="categoryId">Danh mục *</label>
                <select id="categoryId" name="categoryId" required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${product != null and product.category != null and product.category.id == category.id}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="image">Ảnh sản phẩm</label>
                <input id="image" name="image" type="file"
                       accept="image/jpeg,image/png,image/webp">
                <p class="muted">Định dạng JPG, PNG hoặc WEBP; tối đa 5 MB.
                    Không chọn ảnh nếu muốn giữ nguyên ảnh hiện tại.</p>

                <img class="preview"
                     th:if="${product != null and product.imageUrl != null and !product.imageUrl.isBlank()}"
                     th:src="${product.imageUrl}"
                     alt="Ảnh sản phẩm hiện tại">
            </div>

            <div class="field check">
                <input id="active" name="active" type="checkbox" value="true"
                       th:checked="${product == null or product.active}">
                <label for="active">Đang kinh doanh</label>
            </div>

            <div class="actions">
                <button type="submit" class="button primary">Lưu sản phẩm</button>
                <a class="button secondary" th:href="@{/admin/products}">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
