<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bài viết Figureverse</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#090b16;color:#eee}.box{max-width:900px;margin:auto;background:#121629;border:1px solid #303653;border-radius:14px;padding:28px}.form-control,.form-select{background:#0b0e1d;color:#fff;border-color:#343a58}</style></head><body><main class="container py-5"><div class="box"><a th:href="@{/admin/products/news}">← Danh sách bài viết</a><h1 class="h3 my-3" th:text="${article.id==null?'Tạo bài viết':'Chỉnh sửa bài viết'}"></h1><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><form method="post" enctype="multipart/form-data" th:action="@{/admin/products/news/save}" th:object="${article}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Tiêu đề</label><input class="form-control" th:field="*{title}" required maxlength="255"></div><div class="mb-3"><label class="form-label">Slug (đường dẫn)</label><input class="form-control" th:field="*{slug}" required maxlength="500" placeholder="ten-bai-viet"></div><div class="mb-3"><label class="form-label">Mô tả ngắn</label><textarea class="form-control" th:field="*{summary}" rows="2" maxlength="1000"></textarea></div><div class="mb-3"><label class="form-label">Nội dung</label><textarea class="form-control" th:field="*{content}" rows="7"></textarea></div><div class="mb-3"><label class="form-label">Ảnh bìa</label><input class="form-control" type="file" name="imageFile" accept="image/png,image/jpeg,image/webp"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Loại</label><select class="form-select" th:field="*{type}"><option th:each="t:${articleTypes}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="st:${articleStatuses}" th:value="${st}" th:text="${st}"></option></select></div></div><div class="form-check my-3"><input class="form-check-input" type="checkbox" th:field="*{featured}"><label class="form-check-label">Nổi bật</label></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Bắt đầu khuyến mãi</label><input class="form-control" type="datetime-local" name="startAt" th:value="${article.startAt != null ? #temporals.format(article.startAt,'yyyy-MM-dd''T''HH:mm') : ''}"></div><div class="col-md-6"><label class="form-label">Kết thúc khuyến mãi</label><input class="form-control" type="datetime-local" name="endAt" th:value="${article.endAt != null ? #temporals.format(article.endAt,'yyyy-MM-dd''T''HH:mm') : ''}"></div></div><button class="btn btn-info mt-4">Lưu bài viết</button></form></div></main></body></html>
