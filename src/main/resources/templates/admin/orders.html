<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đơn hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{background:#090b16;color:#eee}.box{background:#121629;border:1px solid #303653;border-radius:12px;padding:18px}.table{--bs-table-bg:transparent;--bs-table-color:#eee}.form-select{background:#0b0e1d;color:#eee;border-color:#343a58}</style></head><body><main class="container py-4"><a th:href="@{/admin/dashboard}">← Bảng điều khiển</a><h1 class="my-3">Quản lý đơn hàng</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="box table-responsive"><table class="table align-middle"><thead><tr><th>Mã đơn</th><th>Khách</th><th>Sản phẩm đặt</th><th>Điện thoại</th><th>Địa chỉ</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Lý do hủy</th><th>Chi tiết hủy</th><th>Cập nhật</th></tr></thead><tbody><tr th:each="o:${orders}"><td><b th:text="${o.orderCode}"></b><br><small th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></small></td><td th:text="|${o.customerName} / ${o.customerUsername}|"></td><td th:text="${orderDetails[o.id]}"></td><td th:text="${o.phone}"></td><td th:text="${o.address}"></td><td th:text="${#numbers.formatDecimal(o.total,0,'COMMA',0,'POINT')}+' ₫'"></td><td th:text="${o.paymentMethod}"></td><td th:text="${o.status}"></td><td th:text="${o.cancelReason != null ? o.cancelReason : '—'}"></td><td th:text="${o.cancelNote != null ? o.cancelNote : '—'}"></td><td><form method="post" th:action="@{/admin/orders/{id}/status(id=${o.id})}" class="d-flex gap-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status" class="form-select form-select-sm"><option>Đang xử lý</option><option>Đã xác nhận</option><option>Đang giao</option><option>Hoàn thành</option><option>Đã hủy</option></select><button class="btn btn-info btn-sm">Lưu</button></form></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="11">Chưa có đơn hàng nào.</td></tr></tbody></table></div></main></body></html>
