<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khách hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{background:#090b16;color:#eee}.box{background:#121629;border:1px solid #303653;border-radius:12px;padding:18px}.table{--bs-table-bg:transparent;--bs-table-color:#eee}</style></head><body><main class="container py-4"><a th:href="@{/admin/dashboard}">← Bảng điều khiển</a><h1 class="my-3">Quản lý tài khoản</h1><div class="box table-responsive"><table class="table align-middle"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u:${customers}"><td th:text="${u.username}"></td><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.phone}"></td><td><span th:each="r:${u.roles}" th:text="${r.name}+' '"></span></td><td th:text="${u.active?'Đang hoạt động':'Đã khóa'}"></td><td><form th:if="${!u.adminAccount}" method="post" th:action="@{/admin/customers/{id}/toggle(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm" th:classappend="${u.active?'btn-outline-danger':'btn-outline-success'}" th:text="${u.active?'Khóa':'Mở khóa'}"></button></form><span th:if="${u.adminAccount}">Quản trị</span></td></tr></tbody></table></div></main></body></html>
