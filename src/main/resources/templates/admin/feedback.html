<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback khách hàng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>body{background:#090b16;color:#eee}.box{background:#121629;border:1px solid #303653;border-radius:12px;padding:18px}.table{--bs-table-bg:transparent;--bs-table-color:#eee}.form-select,.form-control{background:#0b0e1d;color:#eee;border-color:#343a58;min-width:120px}.reply-box{min-width:220px}</style>
</head>
<body><main class="container py-4">
<a th:href="@{/admin/dashboard}">← Bảng điều khiển</a><h1 class="my-3">Feedback khách hàng</h1>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="box table-responsive"><table class="table align-middle">
<thead><tr><th>Ngày</th><th>Khách</th><th>Loại</th><th>Đánh giá</th><th>Nội dung</th><th>Phản hồi quản trị</th><th>Trạng thái / thao tác</th></tr></thead>
<tbody>
<tr th:each="f:${feedbacks}">
<td th:text="${#temporals.format(f.createdAt,'dd/MM/yyyy HH:mm')}"></td>
<td th:text="|${f.displayName} (${f.username})|"></td>
<td th:text="${f.category}"></td><td th:text="${f.rating}+'/5 ⭐'"></td>
<td style="min-width:220px;white-space:pre-wrap" th:text="${f.message}"></td>
<td class="reply-box"><div th:if="${f.adminReply != null and !#strings.isEmpty(f.adminReply)}" class="small mb-2" style="white-space:pre-wrap" th:text="${f.adminReply}"></div>
<form method="post" th:action="@{/admin/feedback/{id}/status(id=${f.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<textarea name="adminReply" class="form-control form-control-sm" rows="3" maxlength="1200" placeholder="Nhập phản hồi cho khách..."></textarea>
<button class="btn btn-info btn-sm mt-2" type="submit">Gửi phản hồi</button>
</form></td>
<td><form method="post" th:action="@{/admin/feedback/{id}/status(id=${f.id})}" class="d-flex flex-column gap-2">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<select name="status" class="form-select form-select-sm"><option th:selected="${f.status == 'Mới'}">Mới</option><option th:selected="${f.status == 'Đã xem'}">Đã xem</option><option th:selected="${f.status == 'Đã phản hồi'}">Đã phản hồi</option><option th:selected="${f.status == 'Ẩn'}">Ẩn</option></select>
<button class="btn btn-outline-light btn-sm" type="submit">Cập nhật trạng thái</button></form></td>
</tr>
<tr th:if="${#lists.isEmpty(feedbacks)}"><td colspan="7">Chưa có phản hồi nào.</td></tr>
</tbody></table></div></main></body></html>
