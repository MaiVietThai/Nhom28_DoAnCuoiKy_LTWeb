<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đã có lỗi xảy ra | FIGUREVERSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: #090b16;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: #111426;
            border: 1px solid rgba(175,188,255,.14);
            border-radius: 12px;
            padding: 40px;
            max-width: 540px;
            text-align: center;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(100deg,#63f7e7 2%,#a69bff 52%,#ff71b5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="error-card shadow">
        <div class="error-code" th:text="${status != null ? status : '404'}">404</div>
        <h2 class="mb-3" th:text="${error != null ? error : 'Không tìm thấy trang'}">Không tìm thấy trang</h2>
        <p class="text-secondary mb-4"
           th:text="${message != null and !message.isBlank() ? message : 'Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển hướng.'}">
            Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển hướng.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-neon">
                ← Về trang chủ
            </a>
            <a th:href="@{/cart}" class="btn btn-outline-info">
                Giỏ hàng ↗
            </a>
        </div>
    </div>
</div>
</body>
</html>
